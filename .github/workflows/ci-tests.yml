name: Run Unit and Regression Tests with Code Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths-ignore:  # No need to rerun all the tests if we're only editing documentation and examples
      - "examples/**.ipynb"
      - "sphinx/**"
      - "**.md"
      - "**.rst"
  schedule:
    - cron: "0 0 * * MON"

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
        test-type: [unit, regression]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[develop]"
      shell: bash
    - name: Run ${{ matrix.test-type }} tests
      shell: bash -el {0}
      run: pytest . --${{ matrix.test-type }} --cov=openoa --cov-report=lcov:./${{ matrix.test-type }}-coverage.lcov
    - name: Upload test coverage
      uses: coverallsapp/github-action@v2
      if: contains(matrix.os, 'ubuntu') && contains(matrix.python-version, '3.13')
      with:
        github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
        files: ./${{ matrix.test-type }}-coverage.lcov
        flag-name: ${{ matrix.test-type }}
        parallel: true
        fail-on-error: false
  coverage-finish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          parallel-finished: true
          fail-on-error: false
